<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Noor Education Society</title>

    <meta name="robots"
          content="noindex, nofollow">


    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cinzel:wght@700&display=swap"
          rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="css/admin-login.css">

</head>

<body>

<div class="phone">

    <header class="header">

        <a href="home.html" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <h1>ADMIN LOGIN</h1>

        <button class="menu-btn">

            <i class="fa-solid fa-bars"></i>

        </button>

    </header>

<nav class="mobile-menu" id="mobileMenu">

    <a href="home.html">
        <i class="fa-solid fa-house"></i>
        Home
    </a>

    <a href="about.html">
        <i class="fa-solid fa-school"></i>
        About
    </a>

    <a href="notice.html">
        <i class="fa-solid fa-bullhorn"></i>
        Notice Board
    </a>

    <a href="gallery.html">
        <i class="fa-solid fa-image"></i>
        Gallery
    </a>

    <a href="elearning.html">
        <i class="fa-solid fa-book-open"></i>
        E-Learning
    </a>

    <a href="schedule.html">
        <i class="fa-solid fa-calendar-days"></i>
        Schedule
    </a>

    <a href="contact.html">
        <i class="fa-solid fa-phone"></i>
        Contact
    </a>

    <a href="admin-login.html" class="admin-link">
        <i class="fa-solid fa-user-shield"></i>
        Admin Portal
    </a>

</nav>

    <section class="login-section">

        <div class="login-card">

            <img src="assets/images/logo1.png"
                 alt="School Logo"
                 class="login-logo">

            <h2>Noor Education Society</h2>

            <p class="subtitle">

                Smart School Management Portal

            </p>

             <form class="login-form">

    <div class="input-box">

        <label>

            Username

        </label>

        <div class="input-field">

            <i class="fa-solid fa-user"></i>
<input
    type="text"
    id="username"
    placeholder="Enter Username"
    required>

        </div>

    </div>

    <div class="input-box">

        <label>

            Password

        </label>

        <div class="input-field">

            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required>

            <i class="fa-solid fa-eye toggle-password"
               id="togglePassword"></i>

        </div>

    </div>

    <button type="submit" class="login-btn">

        LOGIN

    </button>

</form>

</div>

</section>

<footer class="footer">

    <div class="footer-logo-box">

        <img src="assets/images/logo1.png"
             alt="School Logo">

    </div>

    <p>

        Noor Education Society

    </p>

    <span>

        Smart School Management Portal

    </span>

</footer>

</div>

<script src="js/admin-login.js"></script>

</body>

</html>
